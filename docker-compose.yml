services:
  web:
    build: .
    ports:
      # Host port is configurable — set HOST_PORT if 3000 is already taken
      # on your server (e.g. HOST_PORT=3010 in Portainer's stack env vars,
      # or in a .env file next to this compose file for plain `docker
      # compose up`). The container's own internal port stays 3000.
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - coachs-office-data:/app/data
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
      # Uncomment and set to protect the app with a shared password (HTTP
      # Basic Auth) — recommended if this is reachable from outside your LAN.
      # - APP_PASSWORD=change-me
      #
      # Optional: pre-fill CHPP consumer keys instead of pasting them into
      # the Settings page after first boot.
      # - CHPP_CONSUMER_KEY=
      # - CHPP_CONSUMER_SECRET=
    restart: unless-stopped

volumes:
  coachs-office-data:
